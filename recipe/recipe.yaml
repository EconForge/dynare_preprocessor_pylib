context:
  name: dynare-preprocessor-pylib
  version: 0.0.1.dev0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ..

build:
  number: 2

requirements:
  build:
    - ${{ compiler("cxx") }}
    - if: target_platform == "win-64"
      then:
        - winflexbison
      else:
        - bison
        - flex
    - meson
    - ninja
    - pkg-config
    - if: target_platform == "emscripten-wasm32"
      then:
        - cross-python_emscripten-wasm32
        - python 3.13.*
      else:
        - python
    - pip
    - nanobind
  host:
    - if: target_platform == "emscripten-wasm32"
      then:
        - python 3.13.*
        - boost-cpp
        - libpython
      else:
        - python
        - libboost-devel
        - nanobind
  run:
    - python
    - numpy

tests:
  - if: target_platform == "emscripten-wasm32"
    then:
      script: pytester
      requirements:
        build:
          - pytester >= 0.9.0
        run:
          - pytester-run >= 0.9.0
      files:
        recipe:
          - test_preproc.py
  - if: target_platform == "linux-64"
    then:
      script:
        - test -f $PREFIX/bin/dynare-preprocessor
        - python test_preproc.py
      files:
        recipe:
          - test_preproc.py
  - if: target_platform == "win-64"
    then:
      script:
        - if not exist "%PREFIX%\Library\bin\dynare-preprocessor.exe" if not exist "%PREFIX%\bin\dynare-preprocessor.exe" exit 1
        - python test_preproc.py
      files:
        recipe:
          - test_preproc.py

about:
  homepage: https://www.dynare.org/
  summary: Dynare preprocessor and Python library
  description: Preprocessor for Dynare economic models with Python nanobind bindings.
  license: GPL-3.0-or-later
  license_file: COPYING

extra:
  recipe-maintainers:
    - albop
    - svillemot
