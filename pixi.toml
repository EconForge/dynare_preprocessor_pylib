[workspace]
authors = ["Pablo Winant <pablo.winant@gmail.com>"]
channels = ["conda-forge"]
name = "dynare_preprocessor"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build_lib = "sh build_lib.sh"
build_bin = "sh build_nolib.sh"

[dependencies]
python = ">=3.13.5,<3.14"
gcc = ">=15.1.0,<15.2"
bison = ">=3.8.2,<4"
flex = ">=2.6.4,<3"
meson = ">=1.8.2,<2"
pkg-config = ">=0.29.2,<0.30"
pybind11 = ">=3.0.0,<4"
libboost-headers = ">=1.88.0,<2"

[feature.test.dependencies]
pytest = ">=8.3.3"
ipykernel = ">=6.29.0"

[feature.test.tasks]
test = "sh build_lib.sh && pytest"
ipython = "sh build_lib.sh && ipython"

[environments]
dev = ["test"]
