[workspace]
name = "dynare_preprocessor"
version = "0.1.0"
description = "Dynare Preprocessor and Python nanobind bindings"
authors = ["Pablo Winant <pablo.winant@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "linux-aarch64", "win-64"]

[dependencies]
cxx-compiler = ">=2.0.0"
c-compiler = ">=2.0.0"
meson = ">=1.3.0"
ninja = ">=1.11.0"
pkg-config = ">=0.29.2,<0.30"
libboost-devel = ">=1.85.0"

[target.linux-64.dependencies]
bison = ">=3.8.2,<4"
flex = ">=2.6.4,<3"
patchelf = "*"

[target.linux-aarch64.dependencies]
bison = ">=3.8.2,<4"
flex = ">=2.6.4,<3"
patchelf = "*"

[target.osx-64.dependencies]
bison = ">=3.8.2,<4"
flex = ">=2.6.4,<3"

[target.osx-arm64.dependencies]
bison = ">=3.8.2,<4"
flex = ">=2.6.4,<3"

[target.win-64.dependencies]
winflexbison = ">=2.5.25"

[feature.python.dependencies]
python = "3.12.*"
nanobind = ">=2.0.0"
meson-python = ">=0.15.0"
python-build = ">=1.0.0"
pip = "*"

[feature.python.tasks]
wheel = "python -m build --wheel --no-isolation --skip-dependency-check"
install-editable = "pip install --no-build-isolation --no-deps -e ."

[feature.python.target.win-64.tasks]
wheel = "python -m build --wheel --no-isolation --skip-dependency-check -Ccompile-args=-j1"
install-editable = "pip install --no-build-isolation --no-deps -e . -Ccompile-args=-j1"

[feature.test.dependencies]
pytest = ">=8.0.0"
numpy = ">=2.0.0"
ipykernel = ">=6.29.0"

[feature.test.tasks]
test = { cmd = "pytest tests", env = { PYTHONPATH = "build/src" } }

[feature.test.target.win-64.tasks]
test = { cmd = "pytest tests", env = { PYTHONPATH = "build-win/src" } }

[target.win-64.tasks]
setup = "meson setup build-win --buildtype=release -Dbuild_library=enabled"
reconfigure = "meson setup build-win --reconfigure --buildtype=release -Dbuild_library=enabled"
compile = "meson compile -C build-win"
test = { cmd = "pytest tests", env = { PYTHONPATH = "build-win/src" } }
test-all = "meson test -C build-win --print-errorlogs"
preprocessor = "build-win/src/dynare-preprocessor.exe"
clean = "python -c \"import shutil; [shutil.rmtree(p, ignore_errors=True) for p in ['build-win', 'build-cli-win', 'dist', 'output']]\""
setup-cli = "meson setup build-cli-win --buildtype=release -Dbuild_cli=enabled -Dbuild_library=disabled"
reconfigure-cli = "meson setup build-cli-win --reconfigure --buildtype=release -Dbuild_cli=enabled -Dbuild_library=disabled"
compile-cli = "meson compile -C build-cli-win"
test-cli = "meson test -C build-cli-win --print-errorlogs"
preprocessor-cli = "build-cli-win/src/dynare-preprocessor.exe"

[tasks]
setup = "meson setup build -Dbuild_library=enabled"
reconfigure = "meson setup build --reconfigure -Dbuild_library=enabled"
compile = "meson compile -C build"
test-all = "meson test -C build --print-errorlogs"
preprocessor = "build/src/dynare-preprocessor"
clean = "rm -rf build build-cli dist output"
compile-win = "bash scripts/win-run.sh pixi run compile"
test-win = "bash scripts/win-run.sh pixi run test"

# Emscripten / WebAssembly conda packaging tasks
build-wasm = "rattler-build build --recipe recipe --target-platform emscripten-wasm32 -c https://repo.prefix.dev/emscripten-forge-4x -c conda-forge --test skip"
test-wasm = "PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-x64 rattler-build build --recipe recipe --target-platform emscripten-wasm32 -c https://repo.prefix.dev/emscripten-forge-4x -c https://repo.prefix.dev/emscripten-forge-dev -c microsoft -c conda-forge --test native-and-emulated"
upload-wasm = "bash -c 'test -f ~/.env && export $(grep -v \"^#\" ~/.env | xargs); rattler-build upload prefix -c econforge output/emscripten-wasm32/dynare-preprocessor-pylib-*.conda'"

# Linux conda packaging tasks
build-linux = "rattler-build build --recipe recipe --target-platform linux-64 -m recipe/variants.yaml -c conda-forge"
upload-linux = "bash -c 'test -f ~/.env && export $(grep -v \"^#\" ~/.env | xargs); for f in output/linux-64/dynare-preprocessor-pylib-*.conda; do rattler-build upload prefix -c econforge --skip-existing \"$f\"; done'"



# Pure C++ CLI tasks
setup-cli = "meson setup build-cli -Dbuild_cli=enabled -Dbuild_library=disabled"
reconfigure-cli = "meson setup build-cli --reconfigure -Dbuild_cli=enabled -Dbuild_library=disabled"
compile-cli = "meson compile -C build-cli"
test-cli = "meson test -C build-cli --print-errorlogs"
preprocessor-cli = "build-cli/src/dynare-preprocessor"

[activation.env]
PYTHONPATH = "build/src"

[target.win-64.activation.env]
PYTHONPATH = "build-win/src"

[environments]
default = ["python", "test"]
cli = []
